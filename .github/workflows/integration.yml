name: Integration

on:
    push:
        branches: [ master ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read
env:
    CARGO_TERM_COLOR: always
    RBMT_LOG_LEVEL: verbose
    RUST_BACKTRACE: 1

jobs:
    integration:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Regtest Client
                      example: client_regtest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  persist-credentials: false

            - name: Setup Rust Cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  cache-on-failure: false

            - name: Setup cargo-rbmt
              uses: ./.github/actions/setup-rbmt

            - name: Setup libbitcoinkernel
              uses: ./.github/actions/setup-libbitcoinkernel

            - name: Run ${{ matrix.name }} Example
              run: cargo rbmt run -- run --release --example ${{ matrix.example }}
              timeout-minutes: 10
              env:
                  BLOCKS: 50
