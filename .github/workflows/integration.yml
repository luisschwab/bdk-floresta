name: Integration

on:
    push:
        branches: [ master ]
    pull_request:
    workflow_dispatch:

concurrency:
    # Cancel in-progress runs on branch updates
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
env:
    CARGO_TERM_COLOR: always
    RBMT_LOG_LEVEL: verbose
    RUST_BACKTRACE: 1
permissions:
    contents: read

jobs:
    integration:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Regtest Client
                      example: client_regtest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Rust Cache
              uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
              with:
                  cache-on-failure: false

            - name: Setup cargo-rbmt
              uses: $/.github/actions/setup-rbmt

            - name: Setup libbitcoinkernel
              uses: $/.github/actions/setup-libbitcoinkernel

            - name: Run ${{ matrix.name }} Example
              run: cargo rbmt run -- run --release --example ${{ matrix.example }}
              timeout-minutes: 10
              env:
                  BLOCKS: 50
